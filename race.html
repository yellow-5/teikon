<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>艇魂 操作レース 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 本編と同じ出走表の紙面。水面を大きく、操作ボタンを親指の位置に */
  color-scheme: light;
  --paper:#eef2f3; --card:#ffffff; --ink:#10212e; --sub:#5b6b76; --rule:rgba(16,33,46,.16);
  --water:#1f8aa6; --water-soft:#cfe8ee; --accent:#e0352b; --b5:#f5c518;
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{max-width:460px;margin:0 auto;min-height:100%;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
h1,h2,.disp{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance}
h1{font-size:40px}
h1 small{display:block;font-size:15px;letter-spacing:.14em;color:var(--water);margin-top:6px}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--sub);font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #1f5fd1;outline-offset:2px}
.btn{display:block;width:100%;padding:13px 16px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;border-radius:6px;text-align:center}
.btn.red{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:6px}
.stack{display:flex;flex-direction:column;gap:8px}
.lbl{font-weight:900;font-size:13px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{padding:9px 6px;text-align:center;font-weight:900;font-size:14px}
.opt span{display:block;font-weight:500;font-size:11.5px;color:var(--sub)}
.opt[aria-pressed=true]{background:var(--ink);color:#fff}
.opt[aria-pressed=true] span{color:#c9d3d9}
input[type=text]{width:100%;padding:10px;font:inherit;font-size:14px;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.how{padding-left:1.4em;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
canvas{display:block;position:fixed;left:0;top:0;background:#bfe1e8;touch-action:none;z-index:5}
#gl{z-index:4}
body.racing{overflow:hidden}
.res{padding:14px;text-align:center}
.big{font-family:var(--display);font-size:38px}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;text-align:left;font-size:14px;border-top:1px solid var(--rule)}
th{font-size:11.5px;color:var(--sub);border-top:none}
tr.me td{background:var(--water-soft);font-weight:900}
td.r{text-align:right}
.chip{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-family:var(--display);font-size:13px;border:2px solid var(--ink);border-radius:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---------- コースと物理（画面に依存しない部分） ---------- */
var D=450,RR=95,LAP=4*D+2*Math.PI*RR,WX=1020,WY=860,INF=30,LAPS=3,T0=-7.5,LS=56;
var COL=['#ffffff','#1a1a1a','#e0352b','#1f5fd1','#f5c518','#1c9a4b'],TXC=['#111','#fff','#fff','#fff','#111','#fff'];
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function pathPos(s,r){
  s=((s%LAP)+LAP)%LAP;
  if(s<D)return [s,r,0];
  s-=D;
  if(s<Math.PI*RR){var a=Math.PI/2-s/RR;return [D+r*Math.cos(a),r*Math.sin(a),a-Math.PI/2];}
  s-=Math.PI*RR;
  if(s<2*D)return [D-s,-r,Math.PI];
  s-=2*D;
  if(s<Math.PI*RR){var b=-Math.PI/2-s/RR;return [-D+r*Math.cos(b),r*Math.sin(b),b-Math.PI/2];}
  s-=Math.PI*RR;
  return [-D+s,r,0];
}
function seg(s){s=((s%LAP)+LAP)%LAP;return s<D?0:s<D+Math.PI*RR?1:s<3*D+Math.PI*RR?2:s<3*D+2*Math.PI*RR?3:4;}
function inTurn(s){var g=seg(s);return g===1||g===3;}
function proj(x,y){
  if(x>D){var a=clamp(Math.atan2(y,x-D),-Math.PI/2,Math.PI/2);return D+(Math.PI/2-a)*RR;}
  if(x<-D){var b=Math.atan2(y,x+D),tr=-Math.PI/2-b;if(tr<0)tr+=2*Math.PI;return 3*D+Math.PI*RR+Math.min(Math.PI,tr)*RR;}
  if(y>=0)return x>=0?x:LAP+x;
  return D+Math.PI*RR+(D-x);
}
function latOff(x,y){if(x>D)return Math.sqrt((x-D)*(x-D)+y*y)-RR;if(x<-D)return Math.sqrt((x+D)*(x+D)+y*y)-RR;return Math.abs(y)-RR;}
function runDist(v,a,t){return t<=0?0:v*(t-(1-Math.exp(-a*t))/a);}
function needTime(dist,v,a){var t=0;while(runDist(v,a,t)<dist&&t<30)t+=.005;return t;}
function Kof(off){return clamp(.72+off*.0036,.7,.96);}
var LINES={in:8,sashi:0,mz:36,makuri:74};
function pickLine(c){var r=Math.random();
  if(c===1)return 'in';if(c===2)return r<.7?'sashi':'makuri';if(c===3)return r<.5?'mz':'makuri';
  if(c===4)return r<.4?'mz':r<.75?'makuri':'sashi';if(c===5)return r<.6?'mz':r<.85?'sashi':'makuri';return r<.5?'mz':'sashi';}
function newRace(cfg){
  var rpn=(cfg.rps||[]).map(function(r){return r.no;}),st=cfg.stats,my=cfg.course||Math.floor(rnd(1,7)),free=!!cfg.free,tl=(cfg.tilt===undefined?-.5:cfg.tilt)+.5,ai=[],names=['潮崎','真壁','戸波','浦辺','磯貝','帆足','舵谷','早瀬','洲崎','千種'].sort(function(){return Math.random()-.5;});
  for(var c=1;c<=6&&!free;c++)if(c!==my&&rpn.indexOf(c)<0){
    var vI=cfg.aiSpeed*(1+rnd(-.035,.035)),sst=Math.random()<.07?rnd(.35,.55):rnd(.04,.27),run=c<=3?170:330;
    sst=Math.round(sst*100)/100;
    var def=cfg.aiDefs?cfg.aiDefs.filter(function(d){return d.no===c;})[0]:null;if(def){sst=def.st;}
    ai.push({no:c,name:def?def.name:names[c],vI:vI,st:sst,run:run,tot:-run,v:0,off:(c-1)*LS,line:pickLine(c),go:sst-needTime(run,vI,1.1),fin:null,x:0,y:0,h:0,wob:rnd(0,6)});}
  var run0=my<=3?170:330;
  var G={t:free?0:T0,my:my,ai:ai,over:false,finished:false,free:free,lapN:-1,lapStart:0,lastLap:null,bestLap:null,flying:false,late:false,stTime:free?0:null,finTime:null,place:null,msg:'',msgT:0,run:run0,
    p:{x:-run0,y:RR+(my-1)*LS,h:0,vF:0,vL:0,tot:-run0,prev:LAP-run0,
       vmax:(150+st.mt*.45)*(1+tl*.045),acc:(.8+st.st*.012)*(1-tl*.1),turn:(1.2+st.tn*.012)*(1-tl*.05),grip:(2+st.tn*.025)*(1-tl*.04),wake:.66+st.mn*.0014,rmin:cfg.rmin||38,bump:.85+st.mn*.001},
    trail:[]};
  G.pass=[];G.turnT=0;G.exitAt=null;G.wasT=false;G.t1=false;G.cut=null;
  G.remoteAI=!!cfg.aiDefs;
  G.rps=(cfg.rps||[]).map(function(r){var rr0=r.no<=3?170:330;return {id:r.id,no:r.no,name:r.name||'友達',x:-rr0,y:RR+(r.no-1)*LS,h:0,vF:0,tot:-rr0,steer:0,fin:null,st:null,flying:false,gone:false,left:false,trail:[],n:null};});
  ai.forEach(function(a){var q=pathPos(a.tot,RR+a.off);a.x=q[0];a.y=q[1];a.h=q[2];});
  /* 手本の印：止まった状態から全開で出て、ST .05 で通過する動き */
  G.launch=.05-needTime(run0,G.p.vmax,G.p.acc);
  return G;
}
function ghostS(G){return -G.run+runDist(G.p.vmax,G.p.acc,G.t-G.launch);}
function say(G,m){G.msg=m;G.msgT=1.4;}
function step(G,dt,inp){
  if(G.over)return;
  var p=G.p;G.t+=dt;if(G.msgT>0)G.msgT-=dt;
  var pOff=latOff(p.x,p.y);
  /* 相手の艇：進入の型（逃げ・差し・まくり差し・まくり）ごとに回る線と速さが違う */
  var order=G.ai.slice().sort(function(a,b){return b.tot-a.tot;});
  var PL=[{tot:p.tot,off:pOff,v:p.vF}];G.rps.forEach(function(r){if(!r.gone)PL.push({tot:r.tot,off:latOff(r.x,r.y),v:r.vF});});
  if(G.remoteAI)G.ai.forEach(function(a){a.tot+=a.v*dt*(inTurn(a.tot)&&a.tot>0?Math.pow(RR/(RR+a.off),.38):1);var q=pathPos(a.tot,RR+a.off);a.x=q[0];a.y=q[1];a.h=q[2];if(a.fin===null&&a.tot>=LAPS*LAP)a.fin=G.t;});
  else G.ai.forEach(function(a){
    var idx=order.indexOf(a),sg=seg(a.tot),first=a.tot<D+Math.PI*RR+40,tg,K=1;
    if(a.tot<D*.3)tg=(a.no-1)*LS;
    else if(first){tg=LINES[a.line];}
    else tg=6+idx*19;
    if(inTurn(a.tot)&&a.tot>0)K=Kof(a.off);
    /* 前の相手の引き波・自分の艇をよける */
    order.forEach(function(o){if(o===a)return;var ds=o.tot-a.tot;
      if(ds>6&&ds<60&&Math.abs(o.off-a.off)<9)K*=.94;
      if(Math.abs(ds)<28&&Math.abs(o.off-a.off)<18&&(ds>0||(ds===0&&o.no<a.no)))tg=Math.max(tg,o.off+24);});
    var cap=1e9;
    PL.forEach(function(pl){var dp=pl.tot-a.tot;
      if(dp>4&&dp<70&&Math.abs(pl.off-a.off)<10)K*=.93;
      /* ツケマイ：外から並ぶか前に出て回ると、内の艇は引き波にはまって失速する */
      if(inTurn(a.tot)&&a.tot>0&&dp>-45&&dp<60&&pl.off>a.off+8&&pl.off<a.off+130)K*=dp<-8?.88:pl.off<a.off+56?.82:.87;
      /* 先行している艇の進路はふさがない：外の艇は間を空けるか後ろを回り、内の艇は内にとどまる */
      if(dp>-14&&dp<95){
        if(a.off>=pl.off){if(dp>30&&tg<pl.off-12){}else if(a.off-pl.off<70)tg=Math.max(tg,pl.off+48);}
        else if(pl.off-a.off<60)tg=Math.max(0,Math.min(tg,pl.off-38));
      }
      if(dp>0&&dp<19&&Math.abs(pl.off-a.off)<11)cap=Math.min(cap,Math.max(pl.v*.98,40));});
    a.off+=(clamp(tg,0,330)-a.off)*Math.min(1,dt*1.5);
    var target=G.t>=a.go?a.vI*K*(1+Math.sin(G.t*1.7+a.wob)*.012):0;
    a.v+=(target-a.v)*(a.v<target?1.1:2.4)*dt;
    a.v=Math.min(a.v,cap);
    a.tot+=a.v*dt*(inTurn(a.tot)&&a.tot>0?Math.pow(RR/(RR+a.off),.38):1);
    var q=pathPos(a.tot,RR+a.off);a.x=q[0];a.y=q[1];a.h=q[2];
    if(a.fin===null&&a.tot>=LAPS*LAP)a.fin=G.t;
  });
  /* 自分の艇 */
  var lim=p.vmax,slow=1;
  G.ai.forEach(function(a){
    var dx=p.x-a.x,dy=p.y-a.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<17&&d>0.01){p.x+=dx/d*(17-d);p.y+=dy/d*(17-d);p.vF*=Math.pow(p.bump,dt*30);if(G.msgT<=0)say(G,'接触！');}
    if(a.v>30)for(var k=1;k<=7;k++){var w=pathPos(a.tot-18*k,RR+a.off);if(Math.abs(p.x-w[0])+Math.abs(p.y-w[1])<16+k){slow=Math.min(slow,p.wake+k*.02);}}
    var sdp=p.tot-a.tot;if(a.v>30&&inTurn(p.tot)&&sdp<0&&sdp>-90&&a.off<45&&latOff(p.x,p.y)<a.off+10){p.vF-=p.vF*(1-a.off/45)*(1.3-p.wake)*dt;if(G.msgT<=0&&G.t>1)say(G,'引き波');}
  });
  G.rps.forEach(function(rq){if(rq.gone)return;var rdx=p.x-rq.x,rdy=p.y-rq.y,rd=Math.sqrt(rdx*rdx+rdy*rdy);
    if(rd<17&&rd>0.01){p.x+=rdx/rd*(17-rd)*.5;p.y+=rdy/rd*(17-rd)*.5;p.vF*=Math.pow(p.bump,dt*30);if(G.msgT<=0)say(G,'接触！');}
    if(rq.vF>30)for(var rk=3;rk<rq.trail.length;rk+=3){var rw=rq.trail[rq.trail.length-1-rk];if(Math.abs(p.x-rw[0])+Math.abs(p.y-rw[1])<17){slow=Math.min(slow,p.wake+.04);break;}}});
  if(slow<1&&G.msgT<=0&&G.t>1)say(G,'引き波');
  var lev=clamp(Number(inp.lever)||0,0,1),target=(G.stTime===null?lim*lev:lim*(.36+.64*lev))*slow;
  p.vF+=(target-p.vF)*(p.vF<target?p.acc:1.6)*dt;
  var steer=clamp(Number(inp.steer)||0,-1,1);
  /* 速いほど曲がりにくい：握ったままだと大きく回り、落とすと小さく回れる */
  var tf=1-.36*clamp((p.vF-.5*lim)/(.5*lim),0,1);
  /* 艇が回れる半径には限りがある（マークぎりぎりを小さく回る近道は効きにくい） */
  if(Math.abs(steer)>.02){p.h+=steer*Math.min(p.turn*tf*(1+.45*(1-lev))*clamp(p.vF/60,.25,1),Math.max(p.vF,25)/p.rmin)*dt;p.vF-=p.vF*(.8-.74*lev)*Math.abs(steer)*dt;}
  /* 向きを変えた分だけ横滑りが残る */
  var c=Math.cos(p.h),s=Math.sin(p.h),vx=p.vx||0,vy=p.vy||0,f=vx*c+vy*s,l=-vx*s+vy*c;
  f+=(p.vF-f)*Math.min(1,dt*6);l*=Math.exp(-p.grip*dt);
  var py0=p.y;p.vx=c*f-s*l;p.vy=s*f+c*l;p.x+=p.vx*dt;p.y+=p.vy*dt;p.slide=Math.abs(l);p.steer=steer;
  /* 壁・内側・ターンマーク */
  if(Math.abs(p.x)>WX){p.x=clamp(p.x,-WX,WX);p.vF*=.6;p.vx*=-.2;}
  if(Math.abs(p.y)>WY){p.y=clamp(p.y,-WY,WY);p.vF*=.6;p.vy*=-.2;}
  /* ターンマーク：触れると減速して外へ押し出される。走り続けることはできる */
  [D,-D].forEach(function(mx){var mdx=p.x-mx,mdy=p.y,md=Math.sqrt(mdx*mdx+mdy*mdy),MR=12;
    if(md<MR){if(md<.01){mdx=0;mdy=1;md=1;}p.x=mx+mdx/md*MR;p.y=mdy/md*MR;p.vF*=Math.pow(.4,dt*4);var nn=(p.vx*mdx+p.vy*mdy)/md;if(nn<0){p.vx-=nn*mdx/md*1.3;p.vy-=nn*mdy/md*1.3;}if(G.msgT<=0)say(G,'ターンマークに接触');}});
  /* マークとマークの間を横切って近道はできない（ルール上、マークの外を回る） */
  if(Math.abs(p.x)<D-6&&(Math.abs(p.y)<7||(py0>=0)!==(p.y>=0))){var sg=py0>=0?1:-1;p.y=sg*7;if(p.vy*sg<0)p.vy*=-.3;p.vF*=Math.pow(.4,dt*4);if(G.msgT<=0)say(G,'ポールに接触');}
  /* 周回 */
  var ps=proj(p.x,p.y),ds=ps-p.prev;if(ds<-LAP/2)ds+=LAP;if(ds>LAP/2)ds-=LAP;p.prev=ps;
  var before=p.tot;p.tot+=ds;
  if(G.free){var ln=Math.floor(p.tot/LAP);
    if(p.tot>=0&&ln>G.lapN){if(G.lapN>=0){G.lastLap=G.t-G.lapStart;if(G.bestLap===null||G.lastLap<G.bestLap)G.bestLap=G.lastLap;say(G,'1周 '+G.lastLap.toFixed(2)+'秒');}G.lapN=ln;G.lapStart=G.t;}
  }else if(!G.finished){
    if(G.stTime===null&&before<0&&p.tot>=0){
      G.stTime=G.t;
      if(G.t<0){G.flying=true;G.finished=true;}
      else say(G,'ST .'+String(Math.min(99,Math.round(G.t*100))).padStart(2,'0'));
    }
    if(G.stTime===null&&G.t>1.5&&!G.late){G.late=true;say(G,'出遅れ！');}
    if(p.tot>=LAPS*LAP&&G.finTime===null){G.finTime=G.t;G.place=1+G.ai.filter(function(a){return a.fin!==null;}).length+G.rps.filter(function(r){return r.fin!==null&&!r.flying&&!r.left;}).length;G.finished=true;}
    if(G.t>100&&!G.finished){G.place=6;G.finished=true;}
  }
  /* 決まり手：ターンの前後で誰をどちら側から抜いたか */
  if(!G.free&&!G.finished&&G.stTime!==null){
    var inT=inTurn(p.tot)&&p.tot>0,po=latOff(p.x,p.y),oth=G.ai.map(function(a){return {o:a,tot:a.tot,off:a.off};});
    G.rps.forEach(function(r){if(!r.gone)oth.push({o:r,tot:r.tot,off:latOff(r.x,r.y)});});
    if(inT)G.turnT=.9;else if(G.turnT>0)G.turnT-=dt;
    oth.forEach(function(x){var ah=p.tot>x.tot;if(x.o._pa===false&&ah&&(G.turnT>0||!G.t1)){var d=po-x.off;G.pass.push(d<-3?'s':d<38?'t':'m');}x.o._pa=ah;});
    if(G.wasT&&!inT)G.exitAt=G.t;
    if(G.exitAt!==null&&G.t-G.exitAt>.7){
      var rk=1+oth.filter(function(x){return x.tot>p.tot;}).length,pp=G.pass,txt='';
      if(pp.length){var hs=pp.indexOf('s')>=0,hm=pp.indexOf('m')>=0,ht=pp.indexOf('t')>=0;txt=hs&&(hm||ht)?'まくり差し！':hs?'差し！':ht&&!hm?'ツケマイ！':'まくり！';}
      else if(!G.t1&&rk===1&&G.my===1)txt='逃げ！';
      if(txt)G.cut={t:txt,at:G.t,rank:rk,n:pp.length};
      G.t1=true;G.pass=[];G.exitAt=null;
    }
    G.wasT=inT;
  }
  G.trail.push([p.x,p.y,p.h]);if(G.trail.length>66)G.trail.shift();
}
window.TEIKON_RACE={newRace:newRace,step:step,ghostS:ghostS,pathPos:pathPos,proj:proj,LAP:LAP,RR:RR,LS:LS};

/* ---------- 画面 ---------- */
var app=document.getElementById('app');if(!app)return;
var PRE={d:{name:'オールD',v:45},b:{name:'オールB',v:65},s:{name:'オールS',v:85}};
var LV={e:{name:'やさしい',sub:'好スタートなら勝てる',v:0,r:30},n:{name:'ふつう',sub:'ミスなく走って互角',v:4,r:38},h:{name:'つよい',sub:'出遅れたら勝てない',v:8,r:46}};
var cfg={pre:'d',lv:'e',code:'',codeMsg:'',stats:null,name:'あなた',view:'fp',course:0,tilt:-.5,free:false};
var VIEWS={fp:{n:'目線',pit:.1,z:11.6,back:5.5,F:.34,cy:.56,rate:12,roll:.085},back:{n:'後ろ',pit:.25,z:27,back:70,F:.46,cy:.5,rate:4.5,roll:.045},high:{n:'上空',pit:.5,z:100,back:135,F:.5,cy:.5,rate:3.5,roll:.02}},VORD=['fp','back','high'];
var G=null,inp={steer:0,lever:0},raf=0,last=0,cv=null,cx=null,W=0,H=0;

var PIT=.25,PITB=.25,C={x:0,y:0,z:27,h:0,c:1,s:0,sp:Math.sin(PIT),cp:Math.cos(PIT),F:500,cy:0,roll:0},SC=null,TREES=null,CROWD=null,ptr={},rot=false,PW=0;
var FOG=[224,238,243];
function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
function fog(c,d,k){var t=clamp((d-260)/1500,0,.74),m=k||1;return 'rgb('+Math.round((c[0]+(FOG[0]-c[0])*t)*m)+','+Math.round((c[1]+(FOG[1]-c[1])*t)*m)+','+Math.round((c[2]+(FOG[2]-c[2])*t)*m)+')';}
function shade(c,m){return 'rgb('+Math.round(c[0]*m)+','+Math.round(c[1]*m)+','+Math.round(c[2]*m)+')';}
function tc(x,y,z){var dx=x-C.x,dy=y-C.y,dz=z-C.z,d=dx*C.c+dy*C.s;return [-dx*C.s+dy*C.c,d*C.sp+dz*C.cp,d*C.cp-dz*C.sp];}
function pj(v){return [W/2+v[0]/v[2]*C.F,C.cy-v[1]/v[2]*C.F];}
function clipN(vs){var out=[],n=vs.length,N=4;for(var i=0;i<n;i++){var a=vs[i],b=vs[(i+1)%n],ia=a[2]>=N,ib=b[2]>=N;
  if(ia)out.push(a);if(ia!==ib){var t=(N-a[2])/(b[2]-a[2]);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,N]);}}return out;}
function poly(pts,fill,stroke,lw){
  var vs=clipN(pts.map(function(q){return tc(q[0],q[1],q[2]);}));if(vs.length<3)return;
  cx.beginPath();for(var i=0;i<vs.length;i++){var s=pj(vs[i]);if(i)cx.lineTo(s[0],s[1]);else cx.moveTo(s[0],s[1]);}cx.closePath();
  if(fill){cx.fillStyle=fill;cx.fill();}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw||1;cx.stroke();}
}
function box(o,d){
  var x0=o.x0,x1=o.x1,y0=o.y0,y1=o.y1,z0=o.z0||0,z1=o.z1;
  var F=[[x0,y0,x1,y0,0,-1],[x1,y0,x1,y1,1,0],[x1,y1,x0,y1,0,1],[x0,y1,x0,y0,-1,0]];
  if(C.z>z1)poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],fog(o.c,d,1.06));
  F.forEach(function(f){
    var fx=(f[0]+f[2])/2,fy=(f[1]+f[3])/2;if((C.x-fx)*f[4]+(C.y-fy)*f[5]<=0)return;
    var m=f[4]?.84:1;
    poly([[f[0],f[1],z0],[f[2],f[3],z0],[f[2],f[3],z1],[f[0],f[1],z1]],fog(o.c,d,m));
    if(o.rows&&d<1300)for(var k=0;k<o.rows.length;k++){var r=o.rows[k];poly([[f[0],f[1],r[0]],[f[2],f[3],r[0]],[f[2],f[3],r[1]],[f[0],f[1],r[1]]],fog(r[2],d,m));}
    if(o.cap)poly([[f[0],f[1],z1-o.cap],[f[2],f[3],z1-o.cap],[f[2],f[3],z1],[f[0],f[1],z1]],fog(o.capc,d,m));
  });
}

  if(G.finished&&G.t-G.finAt>.6&&Math.abs(q[0]-W/2)<100&&q[1]>H*.3&&q[1]<H*.3+54){toResult();return;}
  if(cfg.view==='fp'){var LB=lookBtn();if(q[0]>LB[0]-6&&q[0]<LB[0]+LB[2]+6&&q[1]>LB[1]-6&&q[1]<LB[1]+LB[3]+6){ptr[e.pointerId]={k:'look'};lookHold=1;return;}}
  if(q[0]<W*.42){ptr[e.pointerId]=onKnob(q)?{k:'lev'}:{k:'levr',y0:q[1],l0:inp.lever};if(onKnob(q))setLever(q[1]);}else ptr[e.pointerId]={k:'str',x0:q[0]-inp.steer*Math.min(W*.16,96)};}
function pm(e){var o=ptr[e.pointerId];if(!o)return;e.preventDefault();var q=pt(e);if(o.k==='look')return;if(o.k==='lev')setLever(q[1]);else if(o.k==='levr')inp.lever=clamp(o.l0+(o.y0-q[1])/(H*.5),0,1);else inp.steer=clamp((q[0]-o.x0)/Math.min(W*.16,96),-1,1);}
function pu(e){var o=ptr[e.pointerId];if(!o)return;if(o.k==='str')inp.steer=0;if(o.k==='look')lookHold=0;delete ptr[e.pointerId];}
function lookBtn(){return [86,H*.5-30,66,60];}
function loop(now){
  var dt=Math.min(.034,(now-last)/1000);last=now;
  if(keys.left||keys.right)inp.steer=(keys.right?1:0)-(keys.left?1:0);else if(keys.used&&!Object.keys(ptr).length)inp.steer=0;
  if(keys.used)inp.lever=keys.lever?1:0;
  else if(!Object.keys(ptr).some(function(id){return ptr[id].k==='lev'||ptr[id].k==='levr';}))inp.lever+=(0-inp.lever)*Math.min(1,dt*9);
  netTick(now);var paused=G.menu&&!netRace();if(!paused)step(G,dt,inp);draw(dt);if(paused)audioStop();else audioUpdate();
  if(G.finished&&!G.jing){G.jing=true;G.finAt=G.t;
    if(!G.flying&&G.place===1){beep(784,.14,.14);setTimeout(function(){beep(988,.14,.14);},140);setTimeout(function(){beep(1175,.4,.14);},280);}else beep(G.flying?160:440,.4,.13,G.flying?'square':'sine');}
  raf=requestAnimationFrame(loop);
}
var keys={left:false,right:false,lever:false,used:false},lookHold=0;

window.addEventListener('resize',function(){if(document.body.classList.contains('racing')){size();if(G)draw(.016);}});
app.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),k=el.getAttribute('data-k'),ce=document.getElementById('code');
  if(ce)cfg.code=ce.value;var rn=document.getElementById('rno');if(rn)cfg.rno=rn.value;
  if(a==='pre'){cfg.pre=k;cfg.stats=null;cfg.codeMsg='';show(vTitle());sendHello();}

  else if(a==='view'){cfg.view=k;show(vTitle());}
  else if(a==='course'){cfg.course=+k;show(vTitle());sendHello();}
  else if(a==='tilt'){cfg.tilt=+k;show(vTitle());}
  else if(a==='title2'){show(vTitle());}
  else if(a==='free'){cfg.free=true;audioInit();if(AU)AU.sec=0;start();}
  else if(a==='nethost'){audioInit();netHost();}

  else if(a==='netclose')netClose('');

  else if(a==='netshare'){var u=inviteUrl(),okc=function(){NET.copied='リンクをコピーした。LINEなどに貼り付けて送る。';refreshTitle();};
    if(navigator.share){navigator.share({title:'艇魂 操作レース',text:'艇魂で対戦しよう（部屋番号 '+NET.code+'）',url:u}).catch(function(){});}
    else{try{navigator.clipboard.writeText(u).then(okc,function(){NET.copied='コピーできなかった。下のリンクを長押しでコピーしてほしい。';refreshTitle();});}catch(e){NET.copied='下のリンクを長押しでコピーしてほしい。';refreshTitle();}}}
  else if(a==='netstart')netStart();
  else if(a==='netready'){NET.ready=!NET.ready;NET.msg='';sendHello();netReadyCheck();show(vTitle());}
  else if(a==='load'){var d=decode(cfg.code);if(d){cfg.stats=d;cfg.codeMsg=esc(d.name)+' を読み込んだ。';}else{cfg.stats=null;cfg.codeMsg='コードが読み取れなかった。本編の「セーブコード」で出した文字を全部貼り付けてほしい。';}show(vTitle());}
  else if(a==='loadno')loadNo(cfg.rno);
  else if(a==='go'){cfg.free=false;audioInit();if(AU)AU.sec=99;start();}
  else if(a==='title')show(vTitle());
});
var KEYS={ArrowLeft:'left',ArrowRight:'right',' ':'lever',ArrowUp:'lever'};
window.addEventListener('keydown',function(e){if(KEYS[e.key]&&G&&!G.over&&e.target.tagName!=='INPUT'){keys[KEYS[e.key]]=true;keys.used=true;e.preventDefault();}});
window.addEventListener('keyup',function(e){if(KEYS[e.key])keys[KEYS[e.key]]=false;});
var dm=/[?&]demo=([\d.]+)/.exec(location.search);
if(dm){var vm=/view=(\w+)/.exec(location.search);cfg.view=vm?vm[1]:'back';if(/free/.test(location.search))cfg.free=true;start();cancelAnimationFrame(raf);var n=Math.round(parseFloat(dm[1])*60);
  for(var i=0;i<n&&!G.over;i++){var p=G.p,ip={steer:0,lever:1};if(G.finished&&!G.finAt)G.finAt=G.t-1;
    if(G.stTime===null){ip.lever=G.t>G.launch+.1&&p.tot<ghostS(G)+3?1:0;}
    else{var tg=pathPos(proj(p.x,p.y)+55,RR-8),e=Math.atan2(tg[1]-p.y,tg[0]-p.x)-p.h;while(e>Math.PI)e-=2*Math.PI;while(e<-Math.PI)e+=2*Math.PI;ip.steer=clamp(e*4,-1,1);ip.lever=Math.abs(e)<.5?1:.2;}
    inp.steer=ip.steer;inp.lever=ip.lever;step(G,1/60,ip);draw(1/60);}
  if(/menu=1/.test(location.search)){G.menu=true;draw(1/60);}
  if(/ptest/.test(location.search)){var out=[];function ev(t,x,y){cv.dispatchEvent(new PointerEvent(t,{pointerId:5,clientX:rot?PW-y:x,clientY:rot?x:y,bubbles:true,cancelable:true}));}
    inp.lever=.2;ev('pointerdown',40,H*.5);out.push(inp.lever.toFixed(2));ev('pointermove',40,H*.3);out.push(inp.lever.toFixed(2));ev('pointerup',40,H*.3);out.push(inp.lever.toFixed(2));
    ev('pointerdown',200,H*.7);ev('pointermove',200,H*.5);out.push(inp.lever.toFixed(2));ev('pointerup',200,H*.5);
    ev('pointerdown',W-100,H-50);ev('pointermove',W-60,H-50);out.push(inp.steer.toFixed(2));ev('pointerup',W-60,H-50);out.push(inp.steer.toFixed(2));document.title='PT '+out.join(' ');}
}else{show(vTitle());checkVersion();var nmm=/[?&]no=(\d{4})/.exec(location.search),sno=null;try{sno=localStorage.getItem('teikon-rno');}catch(e){}if(nmm)loadNo(nmm[1]);else if(sno&&/^\d{4}$/.test(sno))loadNo(sno);var rmm=/[?&]room=(\d{4})/.exec(location.search);if(rmm)netJoin(rmm[1]);}
})();
