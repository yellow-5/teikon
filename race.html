<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>艇魂 操作レース 試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 本編と同じ出走表の紙面。水面を大きく、操作ボタンを親指の位置に */
  color-scheme: light;
  --paper:#eef2f3; --card:#ffffff; --ink:#10212e; --sub:#5b6b76; --rule:rgba(16,33,46,.16);
  --water:#1f8aa6; --water-soft:#cfe8ee; --accent:#e0352b; --b5:#f5c518;
  --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{max-width:460px;margin:0 auto;min-height:100%;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
h1,h2,.disp{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance}
h1{font-size:40px}
h1 small{display:block;font-size:15px;letter-spacing:.14em;color:var(--water);margin-top:6px}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--sub);font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #1f5fd1;outline-offset:2px}
.btn{display:block;width:100%;padding:13px 16px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;border-radius:6px;text-align:center}
.btn.red{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:6px}
.stack{display:flex;flex-direction:column;gap:8px}
.lbl{font-weight:900;font-size:13px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{padding:9px 6px;text-align:center;font-weight:900;font-size:14px}
.opt span{display:block;font-weight:500;font-size:11.5px;color:var(--sub)}
.opt[aria-pressed=true]{background:var(--ink);color:#fff}
.opt[aria-pressed=true] span{color:#c9d3d9}
input[type=text]{width:100%;padding:10px;font:inherit;font-size:14px;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.how{padding-left:1.4em;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
canvas{display:block;width:100%;border:2px solid var(--ink);border-radius:6px;background:#bfe1e8;touch-action:none}
.pad{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}
.pad button{height:92px;border:2px solid var(--ink);border-radius:6px;background:#fff;font-family:var(--display);font-size:26px;touch-action:none}
.pad button small{display:block;font-family:var(--body);font-weight:900;font-size:12px}
.pad button.on{background:var(--b5)}
.pad .lever{background:var(--accent);color:#fff}
.pad .lever.on{background:#8f1d16}
.res{padding:14px;text-align:center}
.big{font-family:var(--display);font-size:38px}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;text-align:left;font-size:14px;border-top:1px solid var(--rule)}
th{font-size:11.5px;color:var(--sub);border-top:none}
tr.me td{background:var(--water-soft);font-weight:900}
td.r{text-align:right}
.chip{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-family:var(--display);font-size:13px;border:2px solid var(--ink);border-radius:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---------- コースと物理（画面に依存しない部分） ---------- */
var D=280,RR=70,LAP=4*D+2*Math.PI*RR,WX=430,WY=200,INF=26,LAPS=3,T0=-7.5;
var COL=['#ffffff','#1a1a1a','#e0352b','#1f5fd1','#f5c518','#1c9a4b'],TXC=['#111','#fff','#fff','#fff','#111','#fff'];
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rnd(a,b){return a+Math.random()*(b-a);}
function pathPos(s,r){
  s=((s%LAP)+LAP)%LAP;
  if(s<D)return [s,r,0];
  s-=D;
  if(s<Math.PI*RR){var a=Math.PI/2-s/RR;return [D+r*Math.cos(a),r*Math.sin(a),a-Math.PI/2];}
  s-=Math.PI*RR;
  if(s<2*D)return [D-s,-r,Math.PI];
  s-=2*D;
  if(s<Math.PI*RR){var b=-Math.PI/2-s/RR;return [-D+r*Math.cos(b),r*Math.sin(b),b-Math.PI/2];}
  s-=Math.PI*RR;
  return [-D+s,r,0];
}
function inTurn(s){s=((s%LAP)+LAP)%LAP;return (s>D-30&&s<D+Math.PI*RR+10)||(s>3*D+Math.PI*RR-30);}
function proj(x,y){
  if(x>D){var a=clamp(Math.atan2(y,x-D),-Math.PI/2,Math.PI/2);return D+(Math.PI/2-a)*RR;}
  if(x<-D){var b=Math.atan2(y,x+D),tr=-Math.PI/2-b;if(tr<0)tr+=2*Math.PI;return 3*D+Math.PI*RR+Math.min(Math.PI,tr)*RR;}
  if(y>=0)return x>=0?x:LAP+x;
  return D+Math.PI*RR+(D-x);
}
function newRace(cfg){
  var st=cfg.stats,my=cfg.course||Math.floor(rnd(1,7)),ai=[],names=['潮崎','真壁','戸波','浦辺','磯貝','帆足','舵谷','早瀬','洲崎','千種'].sort(function(){return Math.random()-.5;});
  for(var c=1;c<=6;c++)if(c!==my){var vI=cfg.aiSpeed+rnd(-5,5),sst=Math.round(rnd(.08,.25)*100)/100;
    ai.push({no:c,name:names[c],vI:vI,st:sst,tot:-250,off:(c-1)*13,go:sst-250/vI,fin:null,x:0,y:0,h:0,wob:rnd(0,6)});}
  var G={t:T0,my:my,ai:ai,over:false,flying:false,late:false,stTime:null,finTime:null,place:null,msg:'',msgT:0,
    p:{x:-250,y:RR+(my-1)*13,h:0,vF:0,vL:0,tot:-250,prev:LAP-250,
       vmax:150+st.mt*.45,acc:.8+st.st*.012,turn:1.2+st.tn*.012,grip:2+st.tn*.025,wake:.78+st.mn*.0015,bump:.85+st.mn*.001},
    trail:[]};
  ai.forEach(function(a){var q=pathPos(a.tot,RR+a.off);a.x=q[0];a.y=q[1];a.h=q[2];});
  /* 手本の印：止まった状態から全開で出て、ST .05 で通過する動き */
  var need=0,d=0;while(d<250&&need<20){need+=.005;d=G.p.vmax*(need-(1-Math.exp(-G.p.acc*need))/G.p.acc);}
  G.launch=.05-need;
  return G;
}
function ghostS(G){var u=G.t-G.launch;return u<=0?-250:-250+G.p.vmax*(u-(1-Math.exp(-G.p.acc*u))/G.p.acc);}
function say(G,m){G.msg=m;G.msgT=1.4;}
function step(G,dt,inp){
  if(G.over)return;
  var p=G.p,t0=G.t;G.t+=dt;if(G.msgT>0)G.msgT-=dt;
  /* 相手の艇 */
  var order=G.ai.slice().sort(function(a,b){return b.tot-a.tot;});
  G.ai.forEach(function(a){
    if(G.t>=a.go){var sp=a.vI*(inTurn(a.tot)&&a.tot>0?.82:1)*(1+Math.sin(G.t*1.7+a.wob)*.015);a.tot+=sp*dt;}
    var tg=a.tot<D*.6?(a.no-1)*13:order.indexOf(a)*12;a.off+=(tg-a.off)*Math.min(1,dt*1.2);
    var q=pathPos(a.tot,RR+a.off);a.x=q[0];a.y=q[1];a.h=q[2];
    if(a.fin===null&&a.tot>=LAPS*LAP)a.fin=G.t;
  });
  /* 自分の艇 */
  var lim=p.vmax,slow=1;
  G.ai.forEach(function(a){
    var dx=p.x-a.x,dy=p.y-a.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<17&&d>0.01){p.x+=dx/d*(17-d);p.y+=dy/d*(17-d);p.vF*=Math.pow(p.bump,dt*30);if(G.msgT<=0)say(G,'接触！');}
    for(var k=1;k<=4;k++){var w=pathPos(a.tot-18*k,RR+a.off);if(Math.abs(p.x-w[0])+Math.abs(p.y-w[1])<16){slow=Math.min(slow,p.wake);}}
  });
  if(slow<1&&G.msgT<=0&&G.t>1)say(G,'引き波');
  var target=(inp.lever?lim:(G.stTime===null?0:lim*.42))*slow;
  p.vF+=(target-p.vF)*(p.vF<target?p.acc:1.6)*dt;
  var steer=(inp.right?1:0)-(inp.left?1:0);
  if(steer){p.h+=steer*p.turn*(inp.lever?1:1.45)*dt*clamp(p.vF/60,.25,1);p.vF-=p.vF*.32*dt;}
  /* 向きを変えた分だけ横滑りが残る */
  var c=Math.cos(p.h),s=Math.sin(p.h),vx=p.vx||0,vy=p.vy||0,f=vx*c+vy*s,l=-vx*s+vy*c;
  f+=(p.vF-f)*Math.min(1,dt*6);l*=Math.exp(-p.grip*dt);
  p.vx=c*f-s*l;p.vy=s*f+c*l;p.x+=p.vx*dt;p.y+=p.vy*dt;p.slide=Math.abs(l);
  /* 壁・内側・ターンマーク */
  if(Math.abs(p.x)>WX){p.x=clamp(p.x,-WX,WX);p.vF*=.6;p.vx*=-.2;}
  if(Math.abs(p.y)>WY){p.y=clamp(p.y,-WY,WY);p.vF*=.6;p.vy*=-.2;}
  var nx=clamp(p.x,-D,D),ddx=p.x-nx,dd=Math.sqrt(ddx*ddx+p.y*p.y);
  if(dd<INF){if(dd<.01){p.y=INF;}else{p.x=nx+ddx/dd*INF;p.y=p.y/dd*INF;}p.vF*=Math.pow(.2,dt*4);p.vx*=.5;p.vy*=.5;if(G.msgT<=0)say(G,Math.abs(p.x)>D-4?'ターンマークに接触':'内側に乗り上げ');}
  /* 周回 */
  var ps=proj(p.x,p.y),ds=ps-p.prev;if(ds<-LAP/2)ds+=LAP;if(ds>LAP/2)ds-=LAP;p.prev=ps;
  var before=p.tot;p.tot+=ds;
  if(G.stTime===null&&before<0&&p.tot>=0){
    G.stTime=G.t;
    if(G.t<0){G.flying=true;G.over=true;return;}
    say(G,'ST .'+String(Math.min(99,Math.round(G.t*100))).padStart(2,'0'));
  }
  if(G.stTime===null&&G.t>1.5&&!G.late){G.late=true;say(G,'出遅れ！');}
  if(p.tot>=LAPS*LAP&&G.finTime===null){G.finTime=G.t;G.place=1+G.ai.filter(function(a){return a.fin!==null;}).length;G.over=true;}
  if(G.t>80){G.place=6;G.over=true;}
  G.trail.push([p.x,p.y]);if(G.trail.length>26)G.trail.shift();
}
window.TEIKON_RACE={newRace:newRace,step:step,ghostS:ghostS,pathPos:pathPos,proj:proj,LAP:LAP,RR:RR};

/* ---------- 画面 ---------- */
var app=document.getElementById('app');if(!app)return;
var PRE={d:{name:'オールD',v:45},b:{name:'オールB',v:65},s:{name:'オールS',v:85}};
var LV={e:{name:'やさしい',sub:'一般戦',v:140},n:{name:'ふつう',sub:'G3',v:152},h:{name:'つよい',sub:'SG',v:166}};
var cfg={pre:'d',lv:'e',code:'',codeMsg:'',stats:null,name:'あなた'};
var G=null,inp={left:false,right:false,lever:false},raf=0,last=0,cv=null,cx=null,W=0,H=0;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function decode(code){try{var a=JSON.parse(decodeURIComponent(escape(atob(String(code).replace(/\s/g,'')))));
  var v=[a[3],a[4],a[5],a[6]].map(function(n){return clamp(Math.round(Number(n)||0),1,100);});
  if(!a[0]||v.some(function(n){return !n;}))return null;return {name:String(a[0]).slice(0,10),st:v[0],tn:v[1],mt:v[2],mn:v[3]};}catch(e){return null;}}
function curStats(){if(cfg.stats)return cfg.stats;var v=PRE[cfg.pre].v;return {st:v,tn:v,mt:v,mn:v};}
function vTitle(){
  var s=curStats(),h='<h1>艇魂<small>操作レース 試作版</small></h1>'+
  '<p>自分でハンドルとレバーを操作して3周走る。相手は5艇。</p>'+
  '<div class="stack"><span class="lbl">選手</span><div class="opts">';
  for(var k in PRE)h+='<button class="card opt" data-a="pre" data-k="'+k+'" aria-pressed="'+(!cfg.stats&&cfg.pre===k)+'">'+PRE[k].name+'<span>全能力 '+PRE[k].v+'</span></button>';
  h+='</div><label class="lbl" for="code">育てた選手で走る（セーブコード）</label><input type="text" id="code" placeholder="本編のセーブコードを貼り付け" value="'+esc(cfg.code)+'" autocomplete="off">'+
  '<button class="btn ghost" data-a="load" style="padding:9px;font-size:14px">この選手を読み込む</button>'+
  (cfg.codeMsg?'<p class="sub" style="font-weight:900;color:var(--ink)">'+cfg.codeMsg+'</p>':'')+'</div>'+
  '<p class="sub">走る選手：<b style="color:var(--ink)">'+esc(cfg.stats?cfg.stats.name:PRE[cfg.pre].name)+'</b>　スタート '+s.st+'・ターン '+s.tn+'・整備 '+s.mt+'・メンタル '+s.mn+'</p>'+
  '<div class="stack"><span class="lbl">相手の強さ</span><div class="opts">';
  for(var q in LV)h+='<button class="card opt" data-a="lv" data-k="'+q+'" aria-pressed="'+(cfg.lv===q)+'">'+LV[q].name+'<span>'+LV[q].sub+'</span></button>';
  h+='</div></div><button class="btn red" data-a="go">出走する</button>'+
  '<ol class="how"><li><b>レバー</b>を押している間だけ加速する。離すと減速して、小さく回れる</li><li><b>◀ ▶</b>で向きを変える。コースは左回り</li><li>最初は止まって待つ。隣の<b>黄色い印</b>が動き出したら、レバーを握って並んで走る。印はちょうど良いスタートの手本</li><li>左上の大時計の針が真上に来る前にスタートラインを越えるとフライングで失格。印より前に出なければ安全</li><li>他の艇の後ろの白い波（引き波）に入ると遅くなる</li></ol>'+
  '<p class="sub">能力の効き方：スタート＝加速、ターン＝旋回の鋭さと滑りにくさ、整備＝最高速、メンタル＝引き波と接触への強さ。Macでは ← → キーとスペースキーでも操作できる。</p>'+
  '<p class="sub"><a href="./">本編（育成）にもどる</a></p>';
  return h;
}
function vRace(){
  return '<canvas id="cv"></canvas><div class="pad">'+
  '<button id="bl" aria-label="左に切る">◀<small>左</small></button><button id="br" aria-label="右に切る">▶<small>右</small></button>'+
  '<button id="bv" class="lever" aria-label="レバーを握る">レバー<small>押している間 加速</small></button></div>';
}
function vResult(){
  var st=G.stTime===null?'-':(G.flying?'F':'.'+String(Math.min(99,Math.round(G.stTime*100))).padStart(2,'0'));
  var h='<div class="card res"><div class="big">'+(G.flying?'フライング':G.place+'着'+(G.place===1?'　1着！':''))+'</div>'+
  '<p style="font-weight:900">ST '+st+(G.finTime!==null?'　タイム '+G.finTime.toFixed(1)+'秒':'')+'</p>'+
  '<p class="sub">'+(G.flying?'針が真上に来る前にスタートラインを越えた。黄色い印より前に出ないように。':G.place===1?'見事な逃げ切り。相手を強くしても勝てるか。':G.place<=3?'あと少し。ターンの入口でレバーを離すと小さく回れる。':'ターンで外に流れていないか。レバーを離すタイミングを早めてみよう。')+'</p></div>';
  if(!G.flying){var rows=G.ai.map(function(a){return {no:a.no,name:a.name,t:a.fin===null?999:a.fin,st:a.st,me:false};});
    rows.push({no:G.my,name:cfg.stats?cfg.stats.name:PRE[cfg.pre].name,t:G.finTime===null?998:G.finTime,st:G.stTime,me:true});
    rows.sort(function(a,b){return a.t-b.t;});
    h+='<div class="card" style="padding:2px 8px"><table><tr><th>着</th><th>枠</th><th>選手</th><th class="r">ST</th></tr>';
    rows.forEach(function(r,i){h+='<tr'+(r.me?' class="me"':'')+'><td class="num">'+(i+1)+'</td><td><span class="chip" style="background:'+COL[r.no-1]+';color:'+TXC[r.no-1]+'">'+r.no+'</span></td><td>'+esc(r.name)+'</td><td class="r num">'+(r.st===null?'-':'.'+String(Math.min(99,Math.round(r.st*100))).padStart(2,'0'))+'</td></tr>';});
    h+='</table></div>';}
  return h+'<button class="btn red" data-a="go">もう一度走る</button><button class="btn ghost" data-a="title">選手・強さを変える</button>';
}
function show(html){cancelAnimationFrame(raf);app.innerHTML=html;}
function bind(id,key){
  var b=document.getElementById(id);
  function on(e){e.preventDefault();inp[key]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(x){}}
  function off(e){inp[key]=false;b.classList.remove('on');}
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
}
function start(){
  G=newRace({stats:curStats(),aiSpeed:LV[cfg.lv].v});inp.left=inp.right=inp.lever=false;
  show(vRace());cv=document.getElementById('cv');
  W=cv.clientWidth||340;H=Math.round(clamp(window.innerHeight-250,260,W*1.2));
  var dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';cx=cv.getContext('2d');cx.scale(dpr,dpr);
  bind('bl','left');bind('br','right');bind('bv','lever');
  last=performance.now();raf=requestAnimationFrame(loop);
}
function loop(now){
  var dt=Math.min(.034,(now-last)/1000);last=now;
  step(G,dt,inp);draw();
  if(G.over){setTimeout(function(){show(vResult());},G.flying?700:900);return;}
  raf=requestAnimationFrame(loop);
}
function boat(x,y,h,col,me){
  cx.save();cx.translate(x,y);cx.rotate(h);cx.fillStyle=col;cx.strokeStyle='#10212e';cx.lineWidth=me?2.2:1.2;
  cx.beginPath();cx.moveTo(11,0);cx.lineTo(3,-5.5);cx.lineTo(-10,-5.5);cx.lineTo(-10,5.5);cx.lineTo(3,5.5);cx.closePath();cx.fill();cx.stroke();cx.restore();
}
function draw(){
  var p=G.p,z=W/330,camx=p.x+Math.cos(p.h)*45,camy=p.y+Math.sin(p.h)*45;
  cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  cx.fillStyle='#bfe1e8';cx.fillRect(0,0,W,H);
  cx.save();cx.translate(W/2,H/2);cx.scale(z,z);cx.translate(-camx,-camy);
  cx.strokeStyle='rgba(255,255,255,.6)';cx.lineWidth=1;
  for(var gy=-WY;gy<=WY;gy+=25){cx.beginPath();cx.moveTo(-WX,gy);cx.lineTo(WX,gy);cx.stroke();}
  for(var gx=-WX;gx<=WX;gx+=50){cx.beginPath();cx.moveTo(gx,-WY);cx.lineTo(gx,WY);cx.stroke();}
  cx.strokeStyle='#10212e';cx.lineWidth=5;cx.strokeRect(-WX-8,-WY-8,WX*2+16,WY*2+16);
  cx.fillStyle='#e6f3f6';cx.lineWidth=1.5;cx.beginPath();cx.arc(D,0,INF-6,-Math.PI/2,Math.PI/2);cx.arc(-D,0,INF-6,Math.PI/2,Math.PI*1.5);cx.closePath();cx.fill();cx.stroke();
  cx.setLineDash([6,5]);cx.lineWidth=2;cx.beginPath();cx.moveTo(0,INF);cx.lineTo(0,WY);cx.stroke();cx.setLineDash([]);
  [D,-D].forEach(function(mx){cx.fillStyle='#e0352b';cx.beginPath();cx.arc(mx,0,8,0,7);cx.fill();cx.stroke();cx.fillStyle='#fff';cx.beginPath();cx.arc(mx,0,3.5,0,7);cx.fill();});
  if(G.stTime===null&&G.t<.6){var gs=ghostS(G),gp=pathPos(gs,RR+(G.my-1)*13+15);
    {cx.fillStyle='#f5c518';cx.strokeStyle='#10212e';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(gp[0]+12,gp[1]);cx.lineTo(gp[0]-2,gp[1]-10);cx.lineTo(gp[0]-2,gp[1]+10);cx.closePath();cx.fill();cx.stroke();}}
  G.ai.forEach(function(a){cx.strokeStyle='rgba(255,255,255,.95)';cx.lineWidth=4;cx.lineCap='round';cx.beginPath();
    for(var k=0;k<=4;k++){var w=pathPos(a.tot-12-18*k,RR+a.off);if(k)cx.lineTo(w[0],w[1]);else cx.moveTo(w[0],w[1]);}cx.stroke();});
  cx.strokeStyle='rgba(255,255,255,.95)';cx.lineWidth=4;cx.beginPath();G.trail.forEach(function(q,i){if(i)cx.lineTo(q[0],q[1]);else cx.moveTo(q[0],q[1]);});cx.stroke();
  G.ai.forEach(function(a){boat(a.x,a.y,a.h,COL[a.no-1],false);});
  boat(p.x,p.y,p.h,COL[G.my-1],true);
  cx.strokeStyle='#e0352b';cx.lineWidth=1.8;cx.beginPath();cx.arc(p.x,p.y,15,0,7);cx.stroke();
  cx.restore();
  /* 表示 */
  var lap=clamp(Math.floor(Math.max(0,p.tot)/LAP)+1,1,LAPS),pos=1+G.ai.filter(function(a){return a.tot>p.tot;}).length;
  cx.fillStyle='rgba(16,33,46,.82)';cx.fillRect(W-112,8,104,46);
  cx.fillStyle='#fff';cx.font='900 15px sans-serif';cx.textAlign='left';cx.textBaseline='alphabetic';
  cx.fillText(G.stTime===null?'スタート前':lap+' / '+LAPS+' 周',W-104,27);cx.fillText(pos+' 番手　'+G.my+'号艇',W-104,47);
  /* 小さなコース図 */
  var mw=104,mh=50,mx0=W-112,my0=60;cx.fillStyle='rgba(255,255,255,.85)';cx.fillRect(mx0,my0,mw,mh);cx.strokeStyle='#10212e';cx.lineWidth=1;cx.strokeRect(mx0,my0,mw,mh);
  function mp(x,y){return [mx0+mw/2+x/WX*(mw/2-4),my0+mh/2+y/WY*(mh/2-4)];}
  G.ai.forEach(function(a){var q=mp(a.x,a.y);cx.fillStyle=COL[a.no-1];cx.beginPath();cx.arc(q[0],q[1],3,0,7);cx.fill();cx.stroke();});
  var qq=mp(p.x,p.y);cx.fillStyle='#e0352b';cx.beginPath();cx.arc(qq[0],qq[1],4.5,0,7);cx.fill();cx.stroke();
  /* 大時計 */
  if(G.t<1.2){var ccx=54,ccy=54,r=40,ang=Math.PI*1.5+((G.t-T0)/6)*Math.PI*2;if(G.t>0)ang=0;
    cx.fillStyle='#fff';cx.strokeStyle='#10212e';cx.lineWidth=4;cx.beginPath();cx.arc(ccx,ccy,r,0,7);cx.fill();cx.stroke();
    cx.fillStyle='#10212e';cx.beginPath();cx.arc(ccx,ccy,r-10,0,7);cx.fill();
    cx.fillStyle='#e0352b';cx.fillRect(ccx-2.5,ccy-r+1,5,11);
    cx.save();cx.translate(ccx,ccy);cx.rotate(ang);cx.fillStyle='#f5a800';cx.strokeStyle='#10212e';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(-4,6);cx.lineTo(4,6);cx.lineTo(1.5,-r+3);cx.lineTo(-1.5,-r+3);cx.closePath();cx.fill();cx.stroke();cx.restore();
    cx.fillStyle='#10212e';cx.font='900 13px sans-serif';cx.textAlign='center';cx.fillText(G.t<0?'あと '+Math.ceil(-G.t)+' 秒':'スタート',ccx,ccy+r+16);}
  if(G.stTime===null&&G.t>G.launch&&G.t<G.launch+.9){cx.font='900 24px sans-serif';cx.textAlign='center';cx.lineWidth=5;cx.strokeStyle='#fff';cx.strokeText('レバーを握れ！',W/2,H*.3);cx.fillStyle='#e0352b';cx.fillText('レバーを握れ！',W/2,H*.3);}
  /* 速度 */
  cx.fillStyle='rgba(16,33,46,.82)';cx.fillRect(8,H-22,120,14);cx.fillStyle=p.slide>25?'#e0352b':'#f5c518';cx.fillRect(10,H-20,116*clamp(p.vF/p.vmax,0,1),10);
  if(G.msgT>0){cx.font='900 22px sans-serif';cx.textAlign='center';cx.lineWidth=5;cx.strokeStyle='#fff';cx.strokeText(G.msg,W/2,H*.3);cx.fillStyle='#10212e';cx.fillText(G.msg,W/2,H*.3);}
}
app.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a'),k=el.getAttribute('data-k'),ce=document.getElementById('code');
  if(ce)cfg.code=ce.value;
  if(a==='pre'){cfg.pre=k;cfg.stats=null;cfg.codeMsg='';show(vTitle());}
  else if(a==='lv'){cfg.lv=k;show(vTitle());}
  else if(a==='load'){var d=decode(cfg.code);if(d){cfg.stats=d;cfg.codeMsg=esc(d.name)+' を読み込んだ。';}else{cfg.stats=null;cfg.codeMsg='コードが読み取れなかった。本編の「セーブコード」で出した文字を全部貼り付けてほしい。';}show(vTitle());}
  else if(a==='go')start();
  else if(a==='title')show(vTitle());
});
var KEYS={ArrowLeft:'left',ArrowRight:'right',' ':'lever',ArrowUp:'lever'};
window.addEventListener('keydown',function(e){if(KEYS[e.key]&&G&&!G.over&&e.target.tagName!=='INPUT'){inp[KEYS[e.key]]=true;e.preventDefault();}});
window.addEventListener('keyup',function(e){if(KEYS[e.key])inp[KEYS[e.key]]=false;});
show(vTitle());
})();
</script>
